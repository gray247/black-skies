appId: com.blackskies.desktop
productName: Black Skies
buildVersion: 1.0.0.1
artifactName: BlackSkies-Setup-${version}.${ext}
asar: true
extraMetadata:
  main: dist-electron/main/main.js
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - dist-electron/**
  - '!**/*.map'
  - package.json
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Black Skies
  artifactName: BlackSkies-Setup-${version}.exe
publish: null
