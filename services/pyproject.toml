[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "blackskies-services"
version = "0.1.0"
description = "FastAPI service layer for the Black Skies platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "starlette>=1.3.1,<1.4",
  "uvicorn[standard]>=0.29.0,<0.30",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "pyyaml>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "hypothesis>=6.0",
  "httpx>=0.27.2,<0.28",
  "httpx2>=2.9.1,<2.10"
]

[project.scripts]
blackskies-services = "blackskies.services.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/blackskies"]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--ignore=.venv",
  "--ignore=vendor",
  "--ignore=node_modules",
  "--ignore=build",
  "--ignore=dist"
]
norecursedirs = [
  ".venv",
  "vendor",
  "node_modules",
  "build",
  "dist",
  ".mypy_cache",
  ".pytest_cache"
]
markers = [
  "contract: Contract-level checks validating external service expectations."
]

[tool.black]
line-length = 100
target-version = ["py311"]
# This is a BASIC string, so we escape the backslash.
include = "\\.pyi?$"

# Use a LITERAL triple-quoted string so backslashes in regex are NOT escapes.
exclude = '''
/(
  \\.git
  | \\.venv
  | build
  | dist
  | node_modules
  | vendor
  | __pycache__
  | .*\\.egg-info
)/
'''
