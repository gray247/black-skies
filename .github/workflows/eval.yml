      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Resolve pnpm store path
        id: pnpm_store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
          pnpm install --recursive --frozen-lockfile
      - name: Build renderer and main bundles
        run: |
          pnpm --filter app build:renderer
          pnpm --filter app build:main
      - name: Install headless display runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run truth lane checks
        run: pnpm test:truth
      - name: Write PASS 4 proof summary
        if: always()
        env:
          PASS4_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p build/ci_proof/pass4
          proof_status="failure"
          if [ "$PASS4_JOB_STATUS" = "success" ]; then
            proof_status="success"
          elif [ "$PASS4_JOB_STATUS" = "cancelled" ]; then
            proof_status="cancelled"
          fi
          python scripts/write_gauntlet_pass_summary.py \
            --pass-id "PASS 4" \
            --command "pnpm test:truth" \
            --commit-sha "${{ github.sha }}" \
            --status "$proof_status" \
            --output "build/ci_proof/pass4/summary.json" \
            --artifact "build/truth_receipts/latest.json" \
            --artifact "build/truth_receipts/latest.txt"
      - name: Upload PASS 4 proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gauntlet-pass4-proof
          path: |
            build/ci_proof/pass4/summary.json
            build/truth_receipts/latest.json
            build/truth_receipts/latest.txt
            build/truth_receipts/run_*

  gauntlet-pass3-proof:
    name: Gauntlet PASS 3 Proof (Renderer/Preload)
