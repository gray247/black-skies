name: Validation & Eval Harness

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
      - name: Run black
        run: black --check .
      - name: Run flake8
        run: flake8

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
      - name: Run mypy
        run: mypy

  app-tests:
    name: App Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Run app lint
        run: pnpm --filter app lint
      - name: Build main bundle
        run: pnpm --filter app build:main
      - name: Run app unit tests
        run: pnpm --filter app test

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Run markdownlint
        run: pnpm lint:docs

  app-e2e:
    name: HARNESS_ONLY App Smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter app exec playwright install --with-deps
      - name: Run HARNESS_ONLY Playwright UI smoke tests
        env:
          PLAYWRIGHT_DISABLE_ANIMATIONS: '1'
        run: pnpm --filter app test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            app/playwright-report
            app/test-results

  app-truth-lane:
    name: App Truth Lane (Real Service Path)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
          pnpm install --recursive --frozen-lockfile
      - name: Build renderer and main bundles
        run: |
          pnpm --filter app build:renderer
          pnpm --filter app build:main
      - name: Run truth lane checks
        run: pnpm test:truth
      - name: Write PASS 4 proof summary
        if: success()
        run: |
          mkdir -p build/ci_proof/pass4
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {
              "schema_version": "GauntletPassProof v1",
              "pass_id": "PASS 4",
              "status": "success",
              "commit_sha": "${{ github.sha }}",
              "command": "pnpm test:truth",
              "artifacts": [
                  "build/truth_receipts/latest.json",
                  "build/truth_receipts/latest.txt",
              ],
          }
          path = Path("build/ci_proof/pass4/summary.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload PASS 4 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-pass4-proof
          path: |
            build/ci_proof/pass4/summary.json
            build/truth_receipts/latest.json
            build/truth_receipts/latest.txt
            build/truth_receipts/run_*

  gauntlet-pass3-proof:
    name: Gauntlet PASS 3 Proof (Renderer/Preload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Run PASS 3 targeted suite
        run: |
          pnpm --filter app test -- --run app/main/__tests__/serviceApi.test.ts app/renderer/__tests__/AppCritique.test.tsx app/renderer/__tests__/useCritique.test.ts
      - name: Write PASS 3 proof summary
        if: success()
        run: |
          mkdir -p build/ci_proof/pass3
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {
              "schema_version": "GauntletPassProof v1",
              "pass_id": "PASS 3",
              "status": "success",
              "commit_sha": "${{ github.sha }}",
              "command": "pnpm --filter app test -- --run app/main/__tests__/serviceApi.test.ts app/renderer/__tests__/AppCritique.test.tsx app/renderer/__tests__/useCritique.test.ts",
          }
          path = Path("build/ci_proof/pass3/summary.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload PASS 3 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-pass3-proof
          path: build/ci_proof/pass3/summary.json

  gauntlet-pass5-proof:
    name: Gauntlet PASS 5 Proof (Harness/Smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
          pnpm install --recursive --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter app exec playwright install --with-deps
      - name: Run PASS 5 metadata guard + harness smoke
        env:
          PLAYWRIGHT_DISABLE_ANIMATIONS: '1'
        run: |
          pytest -q services/tests/unit/test_e2e_seam_metadata.py
          pnpm test:e2e
      - name: Write PASS 5 proof summary
        if: success()
        run: |
          mkdir -p build/ci_proof/pass5
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {
              "schema_version": "GauntletPassProof v1",
              "pass_id": "PASS 5",
              "status": "success",
              "commit_sha": "${{ github.sha }}",
              "command": "pytest -q services/tests/unit/test_e2e_seam_metadata.py && pnpm test:e2e",
          }
          path = Path("build/ci_proof/pass5/summary.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload PASS 5 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-pass5-proof
          path: build/ci_proof/pass5/summary.json

  gauntlet-pass6-proof:
    name: Gauntlet PASS 6 Proof (Build/Startup)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
          pnpm install --recursive --frozen-lockfile
      - name: Run PASS 6 checks
        run: |
          python scripts/gauntlet_capability_probe.py
          pnpm --filter app build:renderer
          pnpm --filter app build:main
      - name: Write PASS 6 proof summary
        if: success()
        run: |
          mkdir -p build/ci_proof/pass6
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {
              "schema_version": "GauntletPassProof v1",
              "pass_id": "PASS 6",
              "status": "success",
              "commit_sha": "${{ github.sha }}",
              "command": "python scripts/gauntlet_capability_probe.py && pnpm --filter app build:renderer && pnpm --filter app build:main",
          }
          path = Path("build/ci_proof/pass6/summary.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload PASS 6 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-pass6-proof
          path: build/ci_proof/pass6/summary.json

  gauntlet-proof-manifest:
    name: Publish Gauntlet CI Proof Manifest
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gauntlet-pass3-proof
      - app-truth-lane
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download PASS 3 proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-pass3-proof
          path: ci_artifacts/pass3
      - name: Download PASS 4 proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-pass4-proof
          path: ci_artifacts/pass4
      - name: Download PASS 5 proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-pass5-proof
          path: ci_artifacts/pass5
      - name: Download PASS 6 proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-pass6-proof
          path: ci_artifacts/pass6
      - name: Write gauntlet CI proof manifest
        env:
          PASS3_RESULT: ${{ needs.gauntlet-pass3-proof.result }}
          PASS4_RESULT: ${{ needs.app-truth-lane.result }}
          PASS5_RESULT: ${{ needs.gauntlet-pass5-proof.result }}
          PASS6_RESULT: ${{ needs.gauntlet-pass6-proof.result }}
        run: |
          mkdir -p build/ci_proof
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          commit_sha = "${{ github.sha }}"
          manifest = {
              "schema_version": "GauntletCIProof v1",
              "commit_sha": commit_sha,
              "artifact_root": str(Path("ci_artifacts").resolve()),
              "jobs": {
                  "PASS 3": {
                      "conclusion": "success" if os.environ.get("PASS3_RESULT") == "success" else os.environ.get("PASS3_RESULT", "failure"),
                      "status": "success" if os.environ.get("PASS3_RESULT") == "success" else "failure",
                      "commit_sha": commit_sha,
                      "artifacts": [
                          {"role": "summary", "path": "pass3/build/ci_proof/pass3/summary.json"},
                      ],
                  },
                  "PASS 4": {
                      "conclusion": "success" if os.environ.get("PASS4_RESULT") == "success" else os.environ.get("PASS4_RESULT", "failure"),
                      "status": "success" if os.environ.get("PASS4_RESULT") == "success" else "failure",
                      "commit_sha": commit_sha,
                      "artifacts": [
                          {"role": "summary", "path": "pass4/build/ci_proof/pass4/summary.json"},
                          {"role": "truth_receipt_json", "path": "pass4/build/truth_receipts/latest.json"},
                          {"role": "truth_receipt_txt", "path": "pass4/build/truth_receipts/latest.txt"},
                      ],
                  },
                  "PASS 5": {
                      "conclusion": "success" if os.environ.get("PASS5_RESULT") == "success" else os.environ.get("PASS5_RESULT", "failure"),
                      "status": "success" if os.environ.get("PASS5_RESULT") == "success" else "failure",
                      "commit_sha": commit_sha,
                      "artifacts": [
                          {"role": "summary", "path": "pass5/build/ci_proof/pass5/summary.json"},
                      ],
                  },
                  "PASS 6": {
                      "conclusion": "success" if os.environ.get("PASS6_RESULT") == "success" else os.environ.get("PASS6_RESULT", "failure"),
                      "status": "success" if os.environ.get("PASS6_RESULT") == "success" else "failure",
                      "commit_sha": commit_sha,
                      "artifacts": [
                          {"role": "summary", "path": "pass6/build/ci_proof/pass6/summary.json"},
                      ],
                  },
              },
          }
          out_path = Path("build/ci_proof/gauntlet_ci_proof.json")
          out_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(out_path)
          PY
      - name: Upload gauntlet CI proof manifest
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-ci-proof-manifest
          path: |
            build/ci_proof/gauntlet_ci_proof.json
            ci_artifacts/pass3/build/ci_proof/pass3/summary.json
            ci_artifacts/pass4/build/ci_proof/pass4/summary.json
            ci_artifacts/pass4/build/truth_receipts/latest.json
            ci_artifacts/pass4/build/truth_receipts/latest.txt
            ci_artifacts/pass5/build/ci_proof/pass5/summary.json
            ci_artifacts/pass6/build/ci_proof/pass6/summary.json

  eval:
    name: Services Validation + Eval + Route Smoke
    needs:
      - lint
      - typecheck
      - app-tests
      - docs-lint
      - app-truth-lane
      - gauntlet-pass3-proof
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
      - name: Validate runtime truth ledger
        run: pytest -q services/tests/unit/test_runtime_truth.py
      - name: Run authoritative PASS 2 service-truth lane
        run: python scripts/run_service_truth.py
      - name: Run long-form hardening lane
        run: |
          pytest -q \
            services/tests/unit/test_long_form.py \
            services/tests/unit/test_long_form_execution.py \
            services/tests/unit/test_model_adapters.py
      - name: Run repository pytest suite
        run: pytest -q
      - name: Run HARNESS_ONLY eval harness
        run: python scripts/eval.py --html out/eval.html --json out/eval.json
      - name: Check eval SLO
        run: |
          LEDGER_PATH=$(python - <<'PY'
          from pathlib import Path
          runs_root = Path("sample_project/_runtime/runs")
          if not runs_root.exists():
              raise SystemExit("No evaluation ledgers found.")
          evaluation_ledgers = sorted(
              (path for path in runs_root.glob("evaluation-*/run.json") if path.is_file()),
              key=lambda path: path.stat().st_mtime,
          )
          if not evaluation_ledgers:
              raise SystemExit("No evaluation ledgers found.")
          print(evaluation_ledgers[-1])
          PY
          )
          python scripts/check_slo.py "$LEDGER_PATH"
      - name: Run route smoke tests
        run: bash scripts/smoke.sh
      - name: Start FastAPI service for load test
        run: |
          uvicorn blackskies.services.app:create_app --factory --host 127.0.0.1 --port 43750 &
          echo $! > uvicorn.pid
          sleep 5
      - name: Run load test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/load.py --host 127.0.0.1 --port 43750 --log-level WARNING
      - name: Check load SLO
        run: |
          LEDGER_PATH=$(python - <<'PY'
          from pathlib import Path
          runs_root = Path("sample_project/_runtime/runs")
          if not runs_root.exists():
              raise SystemExit("No load-test ledgers found.")
          latest = max(runs_root.iterdir(), key=lambda p: p.stat().st_mtime)
          print(latest / "run.json")
          PY
          )
          python scripts/check_slo.py "$LEDGER_PATH"
      - name: Upload load test ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-ledger
          path: sample_project/_runtime/runs
      - name: Clean runtime artifacts
        if: always()
        run: rm -rf sample_project/_runtime
      - name: Stop FastAPI service
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
            rm uvicorn.pid
          fi
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            out/eval.html
            out/eval.json
