          elif [ "$PASS6_JOB_STATUS" = "cancelled" ]; then
            proof_status="cancelled"
          fi
          python scripts/write_gauntlet_pass_summary.py \
            --pass-id "PASS 6" \
            --command "python scripts/gauntlet_capability_probe.py && pnpm --filter app build:renderer && pnpm --filter app build:main" \
            --commit-sha "${{ github.sha }}" \
            --status "$proof_status" \
            --output "build/ci_proof/pass6/summary.json"
      - name: Upload PASS 6 proof artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gauntlet-pass6-proof
          path: build/ci_proof/pass6/summary.json

  gauntlet-proof-manifest:
    name: Publish Gauntlet CI Proof Manifest
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gauntlet-pass3-proof
      - app-truth-lane
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download PASS 3 proof
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: gauntlet-pass3-proof
          path: ci_artifacts/pass3
      - name: Download PASS 4 proof
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: gauntlet-pass4-proof
          path: ci_artifacts/pass4
      - name: Download PASS 5 proof
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: gauntlet-pass5-proof
          path: ci_artifacts/pass5
      - name: Download PASS 6 proof
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: gauntlet-pass6-proof
          path: ci_artifacts/pass6
      - name: Write gauntlet CI proof manifest
        env:
          PASS3_RESULT: ${{ needs.gauntlet-pass3-proof.result }}
          PASS4_RESULT: ${{ needs.app-truth-lane.result }}
          PASS5_RESULT: ${{ needs.gauntlet-pass5-proof.result }}
          PASS6_RESULT: ${{ needs.gauntlet-pass6-proof.result }}
        run: |
          mkdir -p build/ci_proof
          python scripts/write_gauntlet_ci_manifest.py \
            --commit-sha "${{ github.sha }}" \
            --artifact-root "ci_artifacts" \
            --output "build/ci_proof/gauntlet_ci_proof.json" \
            --pass3-result "$PASS3_RESULT" \
            --pass4-result "$PASS4_RESULT" \
            --pass5-result "$PASS5_RESULT" \
            --pass6-result "$PASS6_RESULT"
      - name: Materialize missing pass proof placeholders
        if: always()
        env:
          PASS3_RESULT: ${{ needs.gauntlet-pass3-proof.result }}
          PASS4_RESULT: ${{ needs.app-truth-lane.result }}
          PASS5_RESULT: ${{ needs.gauntlet-pass5-proof.result }}
          PASS6_RESULT: ${{ needs.gauntlet-pass6-proof.result }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          entries = [
              ("pass3", "PASS 3", "gauntlet-pass3-proof", "PASS3_RESULT"),
              ("pass4", "PASS 4", "gauntlet-pass4-proof", "PASS4_RESULT"),
              ("pass5", "PASS 5", "gauntlet-pass5-proof", "PASS5_RESULT"),
              ("pass6", "PASS 6", "gauntlet-pass6-proof", "PASS6_RESULT"),
          ]

          import os
          for slug, pass_id, artifact_name, env_key in entries:
              summary = Path(f"ci_artifacts/{slug}/build/ci_proof/{slug}/summary.json")
              if summary.exists():
                  continue
              summary.parent.mkdir(parents=True, exist_ok=True)
              summary.write_text(
                  json.dumps(
                      {
                          "pass_id": pass_id,
                          "status": "missing_artifact",
                          "artifact": artifact_name,
                          "upstream_result": os.environ.get(env_key, "unknown"),
                          "reason": "Upstream pass did not publish proof summary.",
                      },
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )

          pass4_result = os.environ.get("PASS4_RESULT", "unknown")
          pass4_latest_json = Path("ci_artifacts/pass4/build/truth_receipts/latest.json")
          if not pass4_latest_json.exists():
              pass4_latest_json.parent.mkdir(parents=True, exist_ok=True)
              pass4_latest_json.write_text(
                  json.dumps(
                      {
                          "status": "missing_artifact",
                          "artifact": "gauntlet-pass4-proof",
                          "upstream_result": pass4_result,
                          "reason": "PASS 4 truth receipt JSON was not published.",
                      },
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )

          pass4_latest_txt = Path("ci_artifacts/pass4/build/truth_receipts/latest.txt")
          if not pass4_latest_txt.exists():
              pass4_latest_txt.parent.mkdir(parents=True, exist_ok=True)
              pass4_latest_txt.write_text(
                  f"missing_artifact: gauntlet-pass4-proof (upstream_result={pass4_result})\n",
                  encoding="utf-8",
              )
          PY
      - name: Upload gauntlet CI proof manifest
        uses: actions/upload-artifact@v6
        with:
          name: gauntlet-ci-proof-manifest
          path: |
            build/ci_proof/gauntlet_ci_proof.json
            ci_artifacts/pass3/build/ci_proof/pass3/summary.json
            ci_artifacts/pass4/build/ci_proof/pass4/summary.json
            ci_artifacts/pass4/build/truth_receipts/latest.json
            ci_artifacts/pass4/build/truth_receipts/latest.txt
            ci_artifacts/pass5/build/ci_proof/pass5/summary.json
            ci_artifacts/pass6/build/ci_proof/pass6/summary.json

  eval:
    name: Services Validation + Eval + Route Smoke
    needs:
      - lint
      - typecheck
      - app-tests
      - docs-lint
      - app-truth-lane
      - gauntlet-pass3-proof
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
      - name: Validate runtime truth ledger
        run: PYTHONPATH=. pytest -q services/tests/unit/test_runtime_truth.py
      - name: Run authoritative PASS 2 service-truth lane
        run: python scripts/run_service_truth.py
      - name: Run long-form hardening lane
        run: |
          pytest -q \
            services/tests/unit/test_long_form.py \
            services/tests/unit/test_long_form_execution.py \
            services/tests/unit/test_model_adapters.py
      - name: Run repository pytest suite
        run: pytest -q
      - name: Run HARNESS_ONLY eval harness
        run: python scripts/eval.py --html out/eval.html --json out/eval.json
      - name: Check eval SLO
        run: |
          LEDGER_PATH=$(python scripts/find_latest_run.py --kind evaluation --root sample_project/_runtime/runs)
          python scripts/check_slo.py "$LEDGER_PATH"
      - name: Prepare sample project fixture
        run: node scripts/materialize_e2e_fixture.mjs
      - name: Verify sample project fixture contract
        run: node scripts/check_e2e_fixture_contract.mjs
      - name: Run route smoke tests
        run: bash scripts/smoke.sh
      - name: Start FastAPI service for load test
        run: |
          uvicorn blackskies.services.app:create_app --factory --host 127.0.0.1 --port 43750 &
          echo $! > uvicorn.pid
          sleep 5
      - name: Run load test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/load.py --host 127.0.0.1 --port 43750 --log-level WARNING
      - name: Check load SLO
        run: |
          LEDGER_PATH=$(python scripts/find_latest_run.py --kind load-test --root sample_project/_runtime/runs)
          python scripts/check_slo.py "$LEDGER_PATH"
      - name: Upload load test ledger
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: load-ledger
          path: sample_project/_runtime/runs
      - name: Clean runtime artifacts
        if: always()
        run: rm -rf sample_project/_runtime
      - name: Stop FastAPI service
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
            rm uvicorn.pid
          fi
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report
          if-no-files-found: ignore
          path: |
            out/eval.html
            out/eval.json

  ci-observability:
    name: CI Observability Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - app-tests
      - docs-lint
      - app-e2e
      - app-truth-lane
      - gauntlet-pass3-proof
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
      - gauntlet-proof-manifest
      - eval
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Write observability summary artifacts
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          APP_E2E_RESULT: ${{ needs.app-e2e.result }}
          APP_TRUTH_RESULT: ${{ needs.app-truth-lane.result }}
          PASS3_RESULT: ${{ needs.gauntlet-pass3-proof.result }}
          PASS5_RESULT: ${{ needs.gauntlet-pass5-proof.result }}
          PASS6_RESULT: ${{ needs.gauntlet-pass6-proof.result }}
          MANIFEST_RESULT: ${{ needs.gauntlet-proof-manifest.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def classify_from_result(result: str) -> str:
              if result == "success":
                  return "present"
              if result in {"failure", "cancelled", "skipped"}:
                  return "skipped_due_upstream_failure"
              return "missing_expected"

          def entry(group: str, name: str, producer_job: str, producer_result: str) -> dict[str, str]:
              return {
                  "group": group,
                  "name": name,
                  "classification": classify_from_result(producer_result),
                  "producer_job": producer_job,
                  "notes": f"inferred_from_result:{producer_result or 'unknown'}",
              }

          actual_sha = (
              subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          )
          github_sha = os.environ.get("GITHUB_SHA", "")
          app_e2e_result = os.environ.get("APP_E2E_RESULT", "")
          app_truth_result = os.environ.get("APP_TRUTH_RESULT", "")
          pass3_result = os.environ.get("PASS3_RESULT", "")
          pass5_result = os.environ.get("PASS5_RESULT", "")
          pass6_result = os.environ.get("PASS6_RESULT", "")
          manifest_result = os.environ.get("MANIFEST_RESULT", "")
          eval_result = os.environ.get("EVAL_RESULT", "")
          summary = {
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "actor": os.environ.get("GITHUB_ACTOR", ""),
              "job_status": os.environ.get("JOB_STATUS", ""),
              "actual_sha": actual_sha,
          }
          sha_consistency = {
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "job_status": os.environ.get("JOB_STATUS", ""),
              "github_sha": github_sha,
              "actual_sha": actual_sha,
              "sha_match": actual_sha == github_sha,
          }

          artifacts = [
              entry("gauntlet_pass_proof", "gauntlet-pass3-proof", "gauntlet-pass3-proof", pass3_result),
              entry("gauntlet_pass_proof", "gauntlet-pass4-proof", "app-truth-lane", app_truth_result),
              entry("gauntlet_pass_proof", "gauntlet-pass5-proof", "gauntlet-pass5-proof", pass5_result),
              entry("gauntlet_pass_proof", "gauntlet-pass6-proof", "gauntlet-pass6-proof", pass6_result),
              entry("gauntlet_manifest", "gauntlet-ci-proof-manifest", "gauntlet-proof-manifest", manifest_result),
              entry("playwright_artifacts", "playwright-artifacts", "app-e2e", app_e2e_result),
              entry("eval_report", "eval-report", "eval", eval_result),
              entry("load_ledger", "load-ledger", "eval", eval_result),
          ]

          counts = {
              "present": 0,
              "missing_expected": 0,
              "ignored_no_files": 0,
              "skipped_due_upstream_failure": 0,
          }
          for artifact in artifacts:
              classification = artifact["classification"]
              if classification in counts:
                  counts[classification] += 1

          completeness = {
              "schema_version": 1,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "job_status": os.environ.get("JOB_STATUS", ""),
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "artifacts": artifacts,
              "counts": counts,
          }

          Path("ci-run-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-sha-consistency.json").write_text(
              json.dumps(sha_consistency, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-artifact-completeness.json").write_text(
              json.dumps(completeness, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload observability summary artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-observability-${{ github.job }}
          if-no-files-found: ignore
          path: |
            ci-run-summary.json
            ci-sha-consistency.json
            ci-artifact-completeness.json
