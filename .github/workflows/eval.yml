            --command "python scripts/gauntlet_capability_probe.py && pnpm --filter app build:renderer && pnpm --filter app build:main" \
            --commit-sha "${{ github.sha }}" \
            --status "$proof_status" \
            --output "build/ci_proof/pass6/summary.json"
      - name: Upload PASS 6 proof artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gauntlet-pass6-proof
          path: build/ci_proof/pass6/summary.json

  gauntlet-proof-manifest:
    name: Publish Gauntlet CI Proof Manifest
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gauntlet-pass3-proof
      - app-truth-lane
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download PASS 3 proof
        uses: actions/download-artifact@v7
        with:
          name: gauntlet-pass3-proof
          path: ci_artifacts/pass3
      - name: Download PASS 4 proof
        uses: actions/download-artifact@v7
        with:
          name: gauntlet-pass4-proof
          path: ci_artifacts/pass4
      - name: Download PASS 5 proof
        uses: actions/download-artifact@v7
        with:
          name: gauntlet-pass5-proof
          path: ci_artifacts/pass5
      - name: Download PASS 6 proof
        uses: actions/download-artifact@v7
        with:
          name: gauntlet-pass6-proof
          path: ci_artifacts/pass6
      - name: Write gauntlet CI proof manifest
        env:
          PASS3_RESULT: ${{ needs.gauntlet-pass3-proof.result }}
          PASS4_RESULT: ${{ needs.app-truth-lane.result }}
          PASS5_RESULT: ${{ needs.gauntlet-pass5-proof.result }}
          PASS6_RESULT: ${{ needs.gauntlet-pass6-proof.result }}
        run: |
          mkdir -p build/ci_proof
          python scripts/write_gauntlet_ci_manifest.py \
            --commit-sha "${{ github.sha }}" \
            --artifact-root "ci_artifacts" \
            --output "build/ci_proof/gauntlet_ci_proof.json" \
            --pass3-result "$PASS3_RESULT" \
            --pass4-result "$PASS4_RESULT" \
            --pass5-result "$PASS5_RESULT" \
            --pass6-result "$PASS6_RESULT"
      - name: Fail closed on missing, stale, failed, or mixed-commit proof
        run: >-
          python scripts/verify_gauntlet.py
          --ci-proof build/ci_proof/gauntlet_ci_proof.json
          --validate-ci-proof-only
      - name: Upload gauntlet CI proof manifest
        uses: actions/upload-artifact@v6
        with:
          name: gauntlet-ci-proof-manifest
          path: |
            build/ci_proof/gauntlet_ci_proof.json
            ci_artifacts/pass3/summary.json
            ci_artifacts/pass4/ci_proof/pass4/summary.json
            ci_artifacts/pass4/truth_receipts/latest.json
            ci_artifacts/pass4/truth_receipts/latest.txt
            ci_artifacts/pass5/summary.json
            ci_artifacts/pass6/summary.json

  eval:
    name: Services Validation + Eval + Route Smoke
    needs:
      - lint
      - typecheck
      - app-tests
      - docs-lint
      - app-truth-lane
      - gauntlet-pass3-proof
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
      - name: Validate runtime truth ledger
        run: PYTHONPATH=. pytest -q services/tests/unit/test_runtime_truth.py
      - name: Run authoritative PASS 2 service-truth lane
        run: python scripts/run_service_truth.py
      - name: Run long-form hardening lane
        run: |
          pytest -q \
            services/tests/unit/test_long_form.py \
            services/tests/unit/test_long_form_execution.py \
            services/tests/unit/test_model_adapters.py
      - name: Run repository pytest suite
        run: pytest -q
      - name: Run HARNESS_ONLY eval harness
        run: python scripts/eval.py --html out/eval.html --json out/eval.json
      - name: Check eval SLO
        run: |
          LEDGER_PATH=$(python scripts/find_latest_run.py --kind evaluation --root sample_project/_runtime/runs)
          python scripts/check_slo.py "$LEDGER_PATH"
      - name: Prepare sample project fixture
        run: node scripts/materialize_e2e_fixture.mjs
      - name: Verify sample project fixture contract
        run: node scripts/check_e2e_fixture_contract.mjs
      - name: Run route smoke tests
        run: bash scripts/smoke.sh
      - name: Start FastAPI service for load test
        run: |
          uvicorn blackskies.services.app:create_app --factory --host 127.0.0.1 --port 43750 &
          echo $! > uvicorn.pid
          sleep 5
      - name: Run load test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/load.py --host 127.0.0.1 --port 43750 --log-level WARNING
      - name: Check load SLO
        run: |
          LEDGER_PATH=$(python scripts/find_latest_run.py --kind load-test --root sample_project/_runtime/runs)
          python scripts/check_slo.py "$LEDGER_PATH"
      - name: Upload load test ledger
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: load-ledger
          path: sample_project/_runtime/runs
      - name: Clean runtime artifacts
        if: always()
        run: rm -rf sample_project/_runtime
      - name: Stop FastAPI service
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
            rm uvicorn.pid
          fi
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report
          if-no-files-found: ignore
          path: |
            out/eval.html
            out/eval.json

  ci-observability:
    name: CI Observability Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - app-tests
      - docs-lint
      - app-e2e
      - app-truth-lane
      - gauntlet-pass3-proof
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
      - gauntlet-proof-manifest
      - eval
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Write observability summary artifacts
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          APP_TESTS_RESULT: ${{ needs.app-tests.result }}
          DOCS_LINT_RESULT: ${{ needs.docs-lint.result }}
          APP_E2E_RESULT: ${{ needs.app-e2e.result }}
          APP_TRUTH_RESULT: ${{ needs.app-truth-lane.result }}
          PASS3_RESULT: ${{ needs.gauntlet-pass3-proof.result }}
          PASS5_RESULT: ${{ needs.gauntlet-pass5-proof.result }}
          PASS6_RESULT: ${{ needs.gauntlet-pass6-proof.result }}
          MANIFEST_RESULT: ${{ needs.gauntlet-proof-manifest.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def classify_from_result(result: str) -> str:
              if result == "success":
                  return "present"
              if result in {"failure", "cancelled", "skipped"}:
                  return "skipped_due_upstream_failure"
              return "missing_expected"

          def entry(group: str, name: str, producer_job: str, producer_result: str) -> dict[str, str]:
              return {
                  "group": group,
                  "name": name,
                  "classification": classify_from_result(producer_result),
                  "producer_job": producer_job,
                  "notes": f"inferred_from_result:{producer_result or 'unknown'}",
              }

          actual_sha = (
              subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          )
          github_sha = os.environ.get("GITHUB_SHA", "")
          lint_result = os.environ.get("LINT_RESULT", "")
          typecheck_result = os.environ.get("TYPECHECK_RESULT", "")
          app_tests_result = os.environ.get("APP_TESTS_RESULT", "")
          docs_lint_result = os.environ.get("DOCS_LINT_RESULT", "")
          app_e2e_result = os.environ.get("APP_E2E_RESULT", "")
          app_truth_result = os.environ.get("APP_TRUTH_RESULT", "")
          pass3_result = os.environ.get("PASS3_RESULT", "")
          pass5_result = os.environ.get("PASS5_RESULT", "")
          pass6_result = os.environ.get("PASS6_RESULT", "")
          manifest_result = os.environ.get("MANIFEST_RESULT", "")
          eval_result = os.environ.get("EVAL_RESULT", "")
          summary = {
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "actor": os.environ.get("GITHUB_ACTOR", ""),
              "job_status": os.environ.get("JOB_STATUS", ""),
              "actual_sha": actual_sha,
          }
          sha_consistency = {
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "job_status": os.environ.get("JOB_STATUS", ""),
              "github_sha": github_sha,
              "actual_sha": actual_sha,
              "sha_match": actual_sha == github_sha,
          }

          artifacts = [
              entry("gauntlet_pass_proof", "gauntlet-pass3-proof", "gauntlet-pass3-proof", pass3_result),
              entry("gauntlet_pass_proof", "gauntlet-pass4-proof", "app-truth-lane", app_truth_result),
              entry("gauntlet_pass_proof", "gauntlet-pass5-proof", "gauntlet-pass5-proof", pass5_result),
              entry("gauntlet_pass_proof", "gauntlet-pass6-proof", "gauntlet-pass6-proof", pass6_result),
              entry("gauntlet_manifest", "gauntlet-ci-proof-manifest", "gauntlet-proof-manifest", manifest_result),
              entry("playwright_artifacts", "playwright-artifacts", "app-e2e", app_e2e_result),
              entry("eval_report", "eval-report", "eval", eval_result),
              entry("load_ledger", "load-ledger", "eval", eval_result),
          ]

          counts = {
              "present": 0,
              "missing_expected": 0,
              "ignored_no_files": 0,
              "skipped_due_upstream_failure": 0,
          }
          for artifact in artifacts:
              classification = artifact["classification"]
              if classification in counts:
                  counts[classification] += 1

          completeness = {
              "schema_version": 1,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "job_status": os.environ.get("JOB_STATUS", ""),
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "artifacts": artifacts,
              "counts": counts,
          }

          upstream_results = {
              "lint": lint_result,
              "typecheck": typecheck_result,
              "app-tests": app_tests_result,
              "docs-lint": docs_lint_result,
              "app-e2e": app_e2e_result,
              "app-truth-lane": app_truth_result,
              "gauntlet-pass3-proof": pass3_result,
              "gauntlet-pass5-proof": pass5_result,
              "gauntlet-pass6-proof": pass6_result,
              "gauntlet-proof-manifest": manifest_result,
              "eval": eval_result,
          }

          source_signals: list[str] = []
          secondary_classes: list[str] = []
          job_status = os.environ.get("JOB_STATUS", "")

          missing_with_success_producer = [
              a
              for a in artifacts
              if a["classification"] == "missing_expected"
              and upstream_results.get(a["producer_job"], "") == "success"
          ]
          if missing_with_success_producer:
              source_signals.append("missing_expected_with_success_producer")

          def add_secondary(value: str) -> None:
              if value not in secondary_classes:
                  secondary_classes.append(value)

          failing_setup_jobs = [
              j
              for j in ["lint", "typecheck", "app-tests", "docs-lint"]
              if upstream_results.get(j) in {"failure", "cancelled", "skipped"}
          ]
          if failing_setup_jobs:
              source_signals.append(f"setup_jobs_failed:{','.join(failing_setup_jobs)}")

          if upstream_results.get("app-e2e") in {"failure", "cancelled", "skipped"}:
              source_signals.append("app-e2e_failed")

          failing_assertion_jobs = [
              j
              for j in [
                  "app-truth-lane",
                  "gauntlet-pass3-proof",
                  "gauntlet-pass5-proof",
                  "gauntlet-pass6-proof",
                  "gauntlet-proof-manifest",
                  "eval",
              ]
              if upstream_results.get(j) in {"failure", "cancelled", "skipped"}
          ]
          if failing_assertion_jobs:
              source_signals.append(f"validation_jobs_failed:{','.join(failing_assertion_jobs)}")

          if job_status == "success":
              primary_class = "no_failure"
              confidence = "high"
              notes = "All required upstream jobs succeeded for this run."
              if missing_with_success_producer:
                  add_secondary("artifact_missing")
                  confidence = "low"
                  notes = "Run succeeded but completeness suggests missing expected artifacts."
          else:
              if missing_with_success_producer:
                  primary_class = "artifact_missing"
                  confidence = "medium"
                  notes = "Expected artifact missing while producer job reported success."
              elif upstream_results.get("app-e2e") in {"failure", "cancelled", "skipped"}:
                  primary_class = "infra_port_process"
                  confidence = "medium"
                  notes = "Harness/smoke producer job failed."
              elif failing_setup_jobs:
                  primary_class = "setup_tooling"
                  confidence = "high"
                  notes = "Setup/lint/typecheck/app-tests/docs-lint producer failure."
              elif failing_assertion_jobs:
                  primary_class = "test_assertion"
                  confidence = "medium"
                  notes = "Validation/eval/gauntlet producer failure."
              else:
                  primary_class = "unknown_success"
                  confidence = "low"
                  notes = "Non-success run without deterministic class mapping."

          if missing_with_success_producer and primary_class != "artifact_missing":
              add_secondary("artifact_missing")
          if failing_setup_jobs and primary_class != "setup_tooling":
              add_secondary("setup_tooling")
          if upstream_results.get("app-e2e") in {"failure", "cancelled", "skipped"} and primary_class != "infra_port_process":
              add_secondary("infra_port_process")
          if failing_assertion_jobs and primary_class != "test_assertion":
              add_secondary("test_assertion")

          failure_classification = {
              "schema_version": 1,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "job_status": job_status,
              "primary_class": primary_class,
              "secondary_classes": secondary_classes,
              "source_signals": source_signals if source_signals else ["no_failure_signals"],
              "upstream_results": upstream_results,
              "confidence": confidence,
              "notes": notes,
          }

          warning_families = [
              {
                  "family": "NO_COLOR_FORCE_COLOR",
                  "status": "deferred",
                  "source": "deferred_risk_register",
                  "confidence": "medium",
                  "notes": "Known deferred warning family; direct run observation is not asserted in Batch 4A.",
              },
              {
                  "family": "DOCK_LAYOUT_FALLBACK",
                  "status": "deferred",
                  "source": "deferred_risk_register",
                  "confidence": "medium",
                  "notes": "Known deferred compatibility warning; no full-log parsing in this batch.",
              },
              {
                  "family": "ESLINTRC_DEPRECATION",
                  "status": "deferred",
                  "source": "deferred_risk_register",
                  "confidence": "medium",
                  "notes": "Known deferred config migration warning family.",
              },
              {
                  "family": "NODE_ACTION_RUNTIME_WARNING",
                  "status": "unknown",
                  "source": "workflow_metadata_only",
                  "confidence": "low",
                  "notes": "No log parsing in Batch 4A; status intentionally conservative.",
              },
              {
                  "family": "NODE_PUNYCODE_URL_PARSE_TRANSITIVE",
                  "status": "unknown",
                  "source": "workflow_metadata_only",
                  "confidence": "low",
                  "notes": "No deterministic signal source without log parsing.",
              },
              {
                  "family": "RENDERER_TYPEERROR_NOISE",
                  "status": "deferred",
                  "source": "deferred_risk_register",
                  "confidence": "low",
                  "notes": "Deferred warning noise family; reproducibility remains conditional.",
              },
          ]

          warning_counts = {
              "observed": 0,
              "not_observed": 0,
              "deferred": 0,
              "unknown": 0,
          }
          for item in warning_families:
              status = item["status"]
              if status in warning_counts:
                  warning_counts[status] += 1

          warning_summary = {
              "schema_version": 1,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "job_status": job_status,
              "warning_families": warning_families,
              "summary": warning_counts,
              "non_blocking": True,
          }

          Path("ci-run-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-sha-consistency.json").write_text(
              json.dumps(sha_consistency, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-artifact-completeness.json").write_text(
              json.dumps(completeness, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-failure-classification.json").write_text(
              json.dumps(failure_classification, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-warning-summary.json").write_text(
              json.dumps(warning_summary, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload observability summary artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-observability-${{ github.job }}
          if-no-files-found: ignore
          path: |
            ci-run-summary.json
            ci-sha-consistency.json
            ci-artifact-completeness.json
            ci-failure-classification.json
            ci-warning-summary.json
