name: Validation & Eval Harness

on:
  push:
    branches:
      - main
      - phase-b2-memory-lab
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
      - name: Run black (repo-wide)
        run: black --check .
      # TEMPORARY SCOPE NARROWING (verification branch unblock):
      # rationale: repo-wide flake8 backlog is substantial legacy/style debt; keep fail-closed on
      # syntax/runtime-critical classes for active verification scope while dedicated lint cleanup lands.
      # owner: @black-skies-core
      # retire_when: after dedicated flake8 cleanup PR lands, restore full `flake8` command.
      - name: Run flake8 (verification critical)
        run: flake8 services/src services/tests scripts tests tools/runtime_truth --select=E9,F63,F7,F82

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
      # TEMPORARY SCOPE NARROWING (verification branch unblock):
      # rationale: package-wide mypy has known legacy debt in unrelated modules; this lane enforces
      # typing on gauntlet/truth verification plumbing touched in the current branch.
      # owner: @black-skies-core
      # retire_when: after dedicated mypy debt cleanup PR lands, restore full `mypy` package check.
      - name: Run mypy (verification scope)
        run: |
          mypy --follow-imports=skip \
            scripts/verify_gauntlet.py \
            scripts/gauntlet_capability_probe.py \
            scripts/write_gauntlet_ci_manifest.py \
            scripts/write_gauntlet_pass_summary.py \
            scripts/run_service_truth.py \
            tools/runtime_truth/build_runtime_truth.py \
            tools/runtime_truth/validate_runtime_docs.py \
            tools/runtime_truth/validate_deferred_feature_containment.py

  app-tests:
    name: App Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --recursive --no-frozen-lockfile
      - name: Run app lint
        run: pnpm --filter app lint
      - name: Build main bundle
        run: pnpm --filter app build:main
      - name: Run app unit tests
        run: pnpm --filter app test

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --recursive --no-frozen-lockfile
      - name: Run markdownlint
        run: pnpm lint:docs

  app-e2e:
    name: HARNESS_ONLY App Smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --recursive --no-frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter app exec playwright install --with-deps
      - name: Run HARNESS_ONLY Playwright UI smoke tests
        env:
          PLAYWRIGHT_DISABLE_ANIMATIONS: '1'
        run: pnpm --filter app test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            app/playwright-report
            app/test-results

  app-truth-lane:
    name: App Truth Lane (Real Service Path)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
          pnpm install --recursive --no-frozen-lockfile
      - name: Build renderer and main bundles
        run: |
          pnpm --filter app build:renderer
          pnpm --filter app build:main
      - name: Install headless display runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run truth lane checks
        run: pnpm test:truth
      - name: Write PASS 4 proof summary
        if: success()
        run: |
          mkdir -p build/ci_proof/pass4
          python scripts/write_gauntlet_pass_summary.py \
            --pass-id "PASS 4" \
            --command "pnpm test:truth" \
            --commit-sha "${{ github.sha }}" \
            --output "build/ci_proof/pass4/summary.json" \
            --artifact "build/truth_receipts/latest.json" \
            --artifact "build/truth_receipts/latest.txt"
      - name: Upload PASS 4 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-pass4-proof
          path: |
            build/ci_proof/pass4/summary.json
            build/truth_receipts/latest.json
            build/truth_receipts/latest.txt
            build/truth_receipts/run_*

  gauntlet-pass3-proof:
    name: Gauntlet PASS 3 Proof (Renderer/Preload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install --recursive --no-frozen-lockfile
      - name: Run PASS 3 targeted suite
        run: |
          pnpm --filter app test -- --run main/__tests__/serviceApi.test.ts renderer/__tests__/AppCritique.test.tsx renderer/__tests__/useCritique.test.ts
      - name: Write PASS 3 proof summary
        if: success()
        run: |
          mkdir -p build/ci_proof/pass3
          python scripts/write_gauntlet_pass_summary.py \
            --pass-id "PASS 3" \
            --command "pnpm --filter app test -- --run main/__tests__/serviceApi.test.ts renderer/__tests__/AppCritique.test.tsx renderer/__tests__/useCritique.test.ts" \
            --commit-sha "${{ github.sha }}" \
            --output "build/ci_proof/pass3/summary.json"
      - name: Upload PASS 3 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-pass3-proof
          path: build/ci_proof/pass3/summary.json

  gauntlet-pass5-proof:
    name: Gauntlet PASS 5 Proof (Harness/Smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
          pnpm install --recursive --no-frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter app exec playwright install --with-deps
      - name: Build renderer and main bundles
        run: |
          pnpm --filter app build:renderer
          pnpm --filter app build:main
      - name: Install headless display runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run PASS 5 metadata guard + harness smoke
        env:
          PLAYWRIGHT_DISABLE_ANIMATIONS: '1'
        run: |
          pytest -q services/tests/unit/test_e2e_seam_metadata.py
          xvfb-run -a pnpm test:e2e
      - name: Write PASS 5 proof summary
        if: success()
        run: |
          mkdir -p build/ci_proof/pass5
          python scripts/write_gauntlet_pass_summary.py \
            --pass-id "PASS 5" \
            --command "pytest -q services/tests/unit/test_e2e_seam_metadata.py && pnpm test:e2e" \
            --commit-sha "${{ github.sha }}" \
            --output "build/ci_proof/pass5/summary.json"
      - name: Upload PASS 5 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-pass5-proof
          path: build/ci_proof/pass5/summary.json

  gauntlet-pass6-proof:
    name: Gauntlet PASS 6 Proof (Build/Startup)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
          pnpm install --recursive --no-frozen-lockfile
      - name: Run PASS 6 checks
        run: |
          python scripts/gauntlet_capability_probe.py
          pnpm --filter app build:renderer
          pnpm --filter app build:main
      - name: Write PASS 6 proof summary
        if: success()
        run: |
          mkdir -p build/ci_proof/pass6
          python scripts/write_gauntlet_pass_summary.py \
            --pass-id "PASS 6" \
            --command "python scripts/gauntlet_capability_probe.py && pnpm --filter app build:renderer && pnpm --filter app build:main" \
            --commit-sha "${{ github.sha }}" \
            --output "build/ci_proof/pass6/summary.json"
      - name: Upload PASS 6 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-pass6-proof
          path: build/ci_proof/pass6/summary.json

  gauntlet-proof-manifest:
    name: Publish Gauntlet CI Proof Manifest
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gauntlet-pass3-proof
      - app-truth-lane
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download PASS 3 proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-pass3-proof
          path: ci_artifacts/pass3
      - name: Download PASS 4 proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-pass4-proof
          path: ci_artifacts/pass4
      - name: Download PASS 5 proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-pass5-proof
          path: ci_artifacts/pass5
      - name: Download PASS 6 proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-pass6-proof
          path: ci_artifacts/pass6
      - name: Write gauntlet CI proof manifest
        env:
          PASS3_RESULT: ${{ needs.gauntlet-pass3-proof.result }}
          PASS4_RESULT: ${{ needs.app-truth-lane.result }}
          PASS5_RESULT: ${{ needs.gauntlet-pass5-proof.result }}
          PASS6_RESULT: ${{ needs.gauntlet-pass6-proof.result }}
        run: |
          mkdir -p build/ci_proof
          python scripts/write_gauntlet_ci_manifest.py \
            --commit-sha "${{ github.sha }}" \
            --artifact-root "ci_artifacts" \
            --output "build/ci_proof/gauntlet_ci_proof.json" \
            --pass3-result "$PASS3_RESULT" \
            --pass4-result "$PASS4_RESULT" \
            --pass5-result "$PASS5_RESULT" \
            --pass6-result "$PASS6_RESULT"
      - name: Upload gauntlet CI proof manifest
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-ci-proof-manifest
          path: |
            build/ci_proof/gauntlet_ci_proof.json
            ci_artifacts/pass3/build/ci_proof/pass3/summary.json
            ci_artifacts/pass4/build/ci_proof/pass4/summary.json
            ci_artifacts/pass4/build/truth_receipts/latest.json
            ci_artifacts/pass4/build/truth_receipts/latest.txt
            ci_artifacts/pass5/build/ci_proof/pass5/summary.json
            ci_artifacts/pass6/build/ci_proof/pass6/summary.json

  eval:
    name: Services Validation + Eval + Route Smoke
    needs:
      - lint
      - typecheck
      - app-tests
      - docs-lint
      - app-truth-lane
      - gauntlet-pass3-proof
      - gauntlet-pass5-proof
      - gauntlet-pass6-proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements.dev.lock', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.lock -r requirements.dev.lock
      - name: Validate runtime truth ledger
        run: pytest -q services/tests/unit/test_runtime_truth.py
      - name: Run authoritative PASS 2 service-truth lane
        run: python scripts/run_service_truth.py
      - name: Run long-form hardening lane
        run: |
          pytest -q \
            services/tests/unit/test_long_form.py \
            services/tests/unit/test_long_form_execution.py \
            services/tests/unit/test_model_adapters.py
      - name: Run repository pytest suite
        run: pytest -q
      - name: Run HARNESS_ONLY eval harness
        run: python scripts/eval.py --html out/eval.html --json out/eval.json
      - name: Check eval SLO
        run: |
          LEDGER_PATH=$(python scripts/find_latest_run.py --kind evaluation --root sample_project/_runtime/runs)
          python scripts/check_slo.py "$LEDGER_PATH"
      - name: Run route smoke tests
        run: bash scripts/smoke.sh
      - name: Start FastAPI service for load test
        run: |
          uvicorn blackskies.services.app:create_app --factory --host 127.0.0.1 --port 43750 &
          echo $! > uvicorn.pid
          sleep 5
      - name: Run load test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/load.py --host 127.0.0.1 --port 43750 --log-level WARNING
      - name: Check load SLO
        run: |
          LEDGER_PATH=$(python scripts/find_latest_run.py --kind load-test --root sample_project/_runtime/runs)
          python scripts/check_slo.py "$LEDGER_PATH"
      - name: Upload load test ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-ledger
          path: sample_project/_runtime/runs
      - name: Clean runtime artifacts
        if: always()
        run: rm -rf sample_project/_runtime
      - name: Stop FastAPI service
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
            rm uvicorn.pid
          fi
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            out/eval.html
            out/eval.json
