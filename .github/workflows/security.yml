name: Security Audit

on:
  push:
    branches:
      - main
      - phase-b2-memory-lab
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  hygiene:
    name: Repo hygiene enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check tracked paths for banned artifacts
        run: python scripts/check_repo_hygiene.py --tracked

      - name: Check diff hygiene
        run: git diff --check

      - name: Verify checkout stays clean
        run: |
          dirty_tree="$(git status --short --untracked-files=all)"
          ignored_tree="$(git ls-files --others --ignored --exclude-standard --directory)"
          if [ -n "$dirty_tree" ] || [ -n "$ignored_tree" ]; then
            echo "Repository became dirty during hygiene checks:"
            if [ -n "$dirty_tree" ]; then
              printf '%s\n' "$dirty_tree"
            fi
            if [ -n "$ignored_tree" ]; then
              printf '%s\n' "$ignored_tree"
            fi
            exit 1
          fi

  pip-audit:
    name: Security sweep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements.dev.lock
            pyproject.toml

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt .[dev]

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        id: pip_audit
        run: |
          set +e
          pip-audit \
            --strict \
            --format json \
            --output pip-audit-report.json \
            --requirement requirements.lock \
            --requirement requirements.dev.lock
          status=$?
          if [ ! -f pip-audit-report.json ]; then
            echo '{"error":"pip-audit terminated before producing a report"}' > pip-audit-report.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report-${{ matrix.os }}
          path: pip-audit-report.json

      - name: Install Safety
        run: |
          pip install safety

      - name: Run Safety
        id: safety
        run: |
          set +e
          safety check \
            --json \
            --output safety-report.json \
            --file requirements.lock \
            --file requirements.dev.lock
          status=$?
          if [ ! -f safety-report.json ]; then
            echo '{"error":"safety terminated before producing a report"}' > safety-report.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report-${{ matrix.os }}
          path: safety-report.json
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false
      - name: Install JS dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Run pnpm audit
        id: pnpm_audit
        run: |
          set +e
          pnpm audit --recursive --json > pnpm-audit-report.json
          status=$?
          if [ ! -f pnpm-audit-report.json ]; then
            echo '{"error":"pnpm audit terminated before producing a report"}' > pnpm-audit-report.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pnpm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit-report-${{ matrix.os }}
          path: pnpm-audit-report.json
      - name: Prepare load sanity project fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          project_root = Path("sample_project/proj_esther_estate")
          drafts_dir = project_root / "drafts"
          drafts_dir.mkdir(parents=True, exist_ok=True)

          (project_root / "project.json").write_text(
              json.dumps({"project_id": "proj_esther_estate", "name": "Esther Estate"}, indent=2),
              encoding="utf-8",
          )
          outline = {
              "schema_version": "OutlineSchema v1",
              "outline_id": "out_001",
              "project_id": "proj_esther_estate",
              "acts": ["Act I"],
              "chapters": [
                  {"id": "ch_0001", "order": 1, "title": "Chapter 1"},
              ],
              "scenes": [
                  {"id": "sc_0001", "order": 1, "title": "Scene 1", "chapter_id": "ch_0001"},
                  {"id": "sc_0002", "order": 2, "title": "Scene 2", "chapter_id": "ch_0001"},
                  {"id": "sc_0003", "order": 3, "title": "Scene 3", "chapter_id": "ch_0001"},
                  {"id": "sc_0004", "order": 4, "title": "Scene 4", "chapter_id": "ch_0001"},
              ],
          }
          (project_root / "outline.json").write_text(json.dumps(outline, indent=2), encoding="utf-8")

          for index in range(1, 5):
              scene_id = f"sc_{index:04d}"
              (drafts_dir / f"{scene_id}.md").write_text(
                  (
                      f"---\n"
                      f"id: {scene_id}\n"
                      f"title: Scene {index}\n"
                      f"order: {index}\n"
                      f"chapter_id: ch_0001\n"
                      f"---\n"
                      f"Seed scene body {index}.\n"
                  ),
                  encoding="utf-8",
              )
          PY
      - name: Run light-load sanity check
        run: |
          python scripts/load.py --total-cycles 4 --concurrency 2 --timeout 45 --start-service
      - name: Discover load ledger
        if: always()
        id: load_ledger
        run: |
          set +e
          RUN_JSON=$(python scripts/find_latest_run.py --kind load-test)
          LEDGER_ARTIFACT="load-ledger.json"
          status=$?
          if [ "$status" -ne 0 ] || [ -z "$RUN_JSON" ] || [ ! -f "$RUN_JSON" ]; then
            RUN_JSON="$LEDGER_ARTIFACT"
            echo '{"error":"load ledger not found after load run"}' > "$RUN_JSON"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cp "$RUN_JSON" "$LEDGER_ARTIFACT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            RUN_JSON="$LEDGER_ARTIFACT"
          fi
          echo "run_json=$RUN_JSON" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce load SLO
        if: ${{ steps.load_ledger.outputs.found == 'true' }}
        run: python scripts/check_slo.py "${{ steps.load_ledger.outputs.run_json }}"
      - name: Upload load ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-ledger-${{ matrix.os }}
          path: load-ledger.json
      - name: Generate dependency report
        id: dependency_report
        run: |
          set +e
          python scripts/dependency_report.py --output dependency-report.json
          status=$?
          if [ ! -f dependency-report.json ]; then
            echo '{"error":"dependency report generation failed before producing a report"}' > dependency-report.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report-${{ matrix.os }}
          path: dependency-report.json
      - name: Fail if vulnerabilities detected
        if: ${{ steps.pip_audit.outputs.status != '0' || steps.safety.outputs.status != '0' || steps.pnpm_audit.outputs.status != '0' }}
        run: |
          echo "Dependency vulnerabilities detected by pip-audit, Safety, or pnpm audit."
          cat pip-audit-report.json || true
          cat safety-report.json || true
          cat pnpm-audit-report.json || true
          exit 1
