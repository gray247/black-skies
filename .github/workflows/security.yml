name: Security Audit

on:
  push:
    branches:
      - main
      - phase-b2-memory-lab
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    name: Repo hygiene enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check tracked paths for banned artifacts
        run: python scripts/check_repo_hygiene.py --tracked

      - name: Check diff hygiene
        run: git diff --check

      - name: Verify checkout stays clean
        run: |
          dirty_tree="$(git status --short --untracked-files=all)"
          ignored_tree="$(git ls-files --others --ignored --exclude-standard --directory)"
          if [ -n "$dirty_tree" ] || [ -n "$ignored_tree" ]; then
            echo "Repository became dirty during hygiene checks:"
            if [ -n "$dirty_tree" ]; then
              printf '%s\n' "$dirty_tree"
            fi
            if [ -n "$ignored_tree" ]; then
              printf '%s\n' "$ignored_tree"
            fi
            exit 1
          fi

  pip-audit:
    name: Security sweep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            requirements.lock
            requirements.dev.lock
            pyproject.toml

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt .[dev]

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        id: pip_audit
        run: |
          set +e
          pip-audit \
            --strict \
            --format json \
            --output pip-audit-report.json \
            --requirement requirements.lock \
            --requirement requirements.dev.lock
          status=$?
          if [ ! -f pip-audit-report.json ]; then
            echo '{"error":"pip-audit terminated before producing a report"}' > pip-audit-report.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit-report-${{ matrix.os }}
          path: pip-audit-report.json

      - name: Install Safety
        run: |
          pip install safety

      - name: Run Safety
        id: safety
        run: |
          set +e
          safety check \
            --output json \
            --save-json safety-report.json \
            --file requirements.lock \
            --file requirements.dev.lock
          status=$?
          if [ ! -f safety-report.json ]; then
            echo '{"error":"safety terminated before producing a report"}' > safety-report.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safety-report-${{ matrix.os }}
          path: safety-report.json
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
          run_install: false
      - name: Resolve pnpm store path
        id: pnpm_store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install JS dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Run pnpm audit
        id: pnpm_audit
        run: |
          set +e
          pnpm audit --json > pnpm-audit-report.json
          status=$?
          if [ ! -f pnpm-audit-report.json ]; then
            echo '{"error":"pnpm audit terminated before producing a report"}' > pnpm-audit-report.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pnpm audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pnpm-audit-report-${{ matrix.os }}
          path: pnpm-audit-report.json
      - name: Prepare sample project fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("sample_project/proj_esther_estate")
          drafts = root / "drafts"
          drafts.mkdir(parents=True, exist_ok=True)

          (root / "project.json").write_text(
              json.dumps(
                  {
                      "project_id": "proj_esther_estate",
                      "name": "Esther Estate",
                  },
                  indent=2,
              )
          )

          outline = {
              "schema_version": "OutlineSchema v1",
              "outline_id": "out_001",
              "project_id": "proj_esther_estate",
              "acts": ["Act I"],
              "chapters": [{"id": "ch_0001", "order": 1, "title": "Chapter 1"}],
              "scenes": [
                  {
                      "id": f"sc_{i:04d}",
                      "order": i,
                      "title": f"Scene {i}",
                      "chapter_id": "ch_0001",
                  }
                  for i in range(1, 5)
              ],
          }
          (root / "outline.json").write_text(json.dumps(outline, indent=2))

          for i in range(1, 5):
              (drafts / f"sc_{i:04d}.md").write_text(
                  f"---\nid: sc_{i:04d}\ntitle: Scene {i}\norder: {i}\nchapter_id: ch_0001\n---\nScene {i} body.\n"
              )
          PY
      - name: Run light-load sanity check
        run: |
          python scripts/load.py --total-cycles 4 --concurrency 2 --timeout 45 --start-service
      - name: Discover load ledger
        if: always()
        id: load_ledger
        run: |
          set +e
          RUN_JSON=$(python scripts/find_latest_run.py --kind load-test)
          LEDGER_ARTIFACT="load-ledger.json"
          status=$?
          if [ "$status" -ne 0 ] || [ -z "$RUN_JSON" ] || [ ! -f "$RUN_JSON" ]; then
            RUN_JSON="$LEDGER_ARTIFACT"
            echo '{"error":"load ledger not found after load run"}' > "$RUN_JSON"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cp "$RUN_JSON" "$LEDGER_ARTIFACT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            RUN_JSON="$LEDGER_ARTIFACT"
          fi
          echo "run_json=$RUN_JSON" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce load SLO
        if: ${{ steps.load_ledger.outputs.found == 'true' }}
        run: python scripts/check_slo.py "${{ steps.load_ledger.outputs.run_json }}"
      - name: Upload load ledger
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: load-ledger-${{ matrix.os }}
          path: load-ledger.json
      - name: Generate dependency report
        id: dependency_report
        run: |
          set +e
          python scripts/dependency_report.py --output dependency-report.json
          status=$?
          if [ ! -f dependency-report.json ]; then
            echo '{"error":"dependency report generation failed before producing a report"}' > dependency-report.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-report-${{ matrix.os }}
          path: dependency-report.json
      - name: Fail only on HIGH/CRITICAL vulnerabilities
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any

          SEVERITIES = {"high", "critical"}
          findings: list[tuple[str, str, str, str]] = []

          def _load_json(path: str) -> Any:
              report = Path(path)
              if not report.exists():
                  return None
              try:
                  return json.loads(report.read_text(encoding="utf-8"))
              except Exception:
                  return None

          pip_audit = _load_json("pip-audit-report.json")
          if isinstance(pip_audit, dict):
              for dep in pip_audit.get("dependencies", []):
                  if not isinstance(dep, dict):
                      continue
                  package = str(dep.get("name") or "<unknown>")
                  for vuln in dep.get("vulnerabilities", []):
                      if not isinstance(vuln, dict):
                          continue
                      severity = str(vuln.get("severity") or "").lower()
                      if severity in SEVERITIES:
                          findings.append(
                              (
                                  "pip-audit",
                                  package,
                                  severity,
                                  str(vuln.get("id") or "<unknown>"),
                              )
                          )

          safety = _load_json("safety-report.json")
          if isinstance(safety, dict):
              for key in ("vulnerabilities", "issues", "results"):
                  entries = safety.get(key)
                  if not isinstance(entries, list):
                      continue
                  for vuln in entries:
                      if not isinstance(vuln, dict):
                          continue
                      severity = str(vuln.get("severity") or "").lower()
                      if severity in SEVERITIES:
                          findings.append(
                              (
                                  "safety",
                                  str(vuln.get("package_name") or vuln.get("package") or "<unknown>"),
                                  severity,
                                  str(vuln.get("id") or "<unknown>"),
                              )
                          )

          pnpm_audit = _load_json("pnpm-audit-report.json")
          if isinstance(pnpm_audit, dict):
              vulnerabilities = pnpm_audit.get("vulnerabilities")
              if isinstance(vulnerabilities, dict):
                  for package, data in vulnerabilities.items():
                      if not isinstance(data, dict):
                          continue
                      severity = str(data.get("severity") or "").lower()
                      if severity in SEVERITIES:
                          findings.append(
                              ("pnpm", str(package), severity, str(data.get("id") or "<unknown>"))
                          )

          print(f"HIGH/CRITICAL findings: {len(findings)}")
          for source, package, severity, advisory in findings:
              print(f"- {source}: {package} [{severity}] ({advisory})")

          raise SystemExit(1 if findings else 0)
          PY
