name: Security Audit

on:
  push:
    branches:
      - main
      - phase-b2-memory-lab
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    name: Repo hygiene enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check tracked paths for banned artifacts
        run: python scripts/check_repo_hygiene.py --tracked

      - name: Check diff hygiene
        run: git diff --check

      - name: Verify checkout stays clean
        run: |
          dirty_tree="$(git status --short --untracked-files=all)"
          ignored_tree="$(git ls-files --others --ignored --exclude-standard --directory)"
          if [ -n "$dirty_tree" ] || [ -n "$ignored_tree" ]; then
            echo "Repository became dirty during hygiene checks:"
            if [ -n "$dirty_tree" ]; then
              printf '%s\n' "$dirty_tree"
            fi
            if [ -n "$ignored_tree" ]; then
              printf '%s\n' "$ignored_tree"
            fi
            exit 1
          fi

  pip-audit:
    name: Security sweep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            requirements.lock
            requirements.dev.lock
            pyproject.toml

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt .[dev]

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        id: pip_audit
        run: |
          set +e
          pip-audit \
            --strict \
            --format json \
            --output pip-audit-report.json \
            --requirement requirements.lock \
            --requirement requirements.dev.lock
          status=$?
          test -s pip-audit-report.json || { echo "pip-audit produced no report" >&2; exit 1; }
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit-report-${{ matrix.os }}
          path: pip-audit-report.json

      - name: Install Safety
        run: |
          pip install safety

      - name: Run Safety
        id: safety
        run: |
          set +e
          safety check \
            --output json \
            --save-json safety-report.json \
            --file requirements.lock \
            --file requirements.dev.lock
          status=$?
          test -s safety-report.json || { echo "Safety produced no report" >&2; exit 1; }
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safety-report-${{ matrix.os }}
          path: safety-report.json
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve pnpm store path
        id: pnpm_store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install JS dependencies
        run: pnpm install --recursive --frozen-lockfile
      - name: Run pnpm audit
        id: pnpm_audit
        run: |
          set +e
          pnpm audit --json > pnpm-audit-report.json
          status=$?
          test -s pnpm-audit-report.json || { echo "pnpm audit produced no report" >&2; exit 1; }
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pnpm audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pnpm-audit-report-${{ matrix.os }}
          path: pnpm-audit-report.json
      - name: Prepare sample project fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("sample_project/proj_esther_estate")
          drafts = root / "drafts"
          drafts.mkdir(parents=True, exist_ok=True)

          (root / "project.json").write_text(
              json.dumps(
                  {
                      "project_id": "proj_esther_estate",
                      "name": "Esther Estate",
                  },
                  indent=2,
              )
          )

          outline = {
              "schema_version": "OutlineSchema v1",
              "outline_id": "out_001",
              "project_id": "proj_esther_estate",
              "acts": ["Act I"],
              "chapters": [{"id": "ch_0001", "order": 1, "title": "Chapter 1"}],
              "scenes": [
                  {
                      "id": f"sc_{i:04d}",
                      "order": i,
                      "title": f"Scene {i}",
                      "chapter_id": "ch_0001",
                  }
                  for i in range(1, 5)
              ],
          }
          (root / "outline.json").write_text(json.dumps(outline, indent=2))

          for i in range(1, 5):
              (drafts / f"sc_{i:04d}.md").write_text(
                  f"---\nid: sc_{i:04d}\ntitle: Scene {i}\norder: {i}\nchapter_id: ch_0001\n---\nScene {i} body.\n"
              )
          PY
      - name: Run light-load sanity check
        run: |
          python scripts/load.py --total-cycles 4 --concurrency 2 --timeout 45 --start-service
      - name: Discover load ledger
        if: always()
        id: load_ledger
        run: |
          set +e
          RUN_JSON=$(python scripts/find_latest_run.py --kind load-test)
          LEDGER_ARTIFACT="load-ledger.json"
          status=$?
          if [ "$status" -ne 0 ] || [ -z "$RUN_JSON" ] || [ ! -f "$RUN_JSON" ]; then
            echo "load ledger not found after load run" >&2
            exit 1
          fi
          cp "$RUN_JSON" "$LEDGER_ARTIFACT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          RUN_JSON="$LEDGER_ARTIFACT"
          echo "run_json=$RUN_JSON" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce load SLO
        run: python scripts/check_slo.py "${{ steps.load_ledger.outputs.run_json }}"
      - name: Upload load ledger
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: load-ledger-${{ matrix.os }}
          if-no-files-found: ignore
          path: load-ledger.json
      - name: Generate dependency report
        id: dependency_report
        run: |
          set +e
          python scripts/dependency_report.py --output dependency-report.json
          status=$?
          test -s dependency-report.json || { echo "dependency report was not produced" >&2; exit 1; }
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-report-${{ matrix.os }}
          path: dependency-report.json
      - name: Fail only on HIGH/CRITICAL vulnerabilities
        env:
          PIP_AUDIT_STATUS: ${{ steps.pip_audit.outputs.status }}
          SAFETY_STATUS: ${{ steps.safety.outputs.status }}
          PNPM_AUDIT_STATUS: ${{ steps.pnpm_audit.outputs.status }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any
          import os

          SEVERITIES = {"high", "critical"}
          findings: list[tuple[str, str, str, str]] = []

          def _load_json(path: str) -> Any:
              report = Path(path)
              if not report.exists():
                  raise SystemExit(f"Required security report is missing: {path}")
              try:
                  return json.loads(report.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Required security report is malformed: {path}: {exc}") from exc

          for name in ("PIP_AUDIT_STATUS", "SAFETY_STATUS", "PNPM_AUDIT_STATUS"):
              if os.environ.get(name) not in {"0", "1"}:
                  raise SystemExit(f"{name} indicates scanner failure, not a completed findings report: {os.environ.get(name)!r}")

          pip_audit = _load_json("pip-audit-report.json")
          if not isinstance(pip_audit, dict) or not isinstance(pip_audit.get("dependencies"), list):
              raise SystemExit("pip-audit report has an unexpected schema")
          if isinstance(pip_audit, dict):
              for dep in pip_audit.get("dependencies", []):
                  if not isinstance(dep, dict):
                      continue
                  package = str(dep.get("name") or "<unknown>")
                  for vuln in dep.get("vulnerabilities", []):
                      if not isinstance(vuln, dict):
                          continue
                      severity = str(vuln.get("severity") or "").lower()
                      if severity in SEVERITIES:
                          findings.append(
                              (
                                  "pip-audit",
                                  package,
                                  severity,
                                  str(vuln.get("id") or "<unknown>"),
                              )
                          )

          safety = _load_json("safety-report.json")
          if not isinstance(safety, (dict, list)):
              raise SystemExit("Safety report has an unexpected schema")
          if isinstance(safety, dict):
              for key in ("vulnerabilities", "issues", "results"):
                  entries = safety.get(key)
                  if not isinstance(entries, list):
                      continue
                  for vuln in entries:
                      if not isinstance(vuln, dict):
                          continue
                      severity = str(vuln.get("severity") or "").lower()
                      if severity in SEVERITIES:
                          findings.append(
                              (
                                  "safety",
                                  str(vuln.get("package_name") or vuln.get("package") or "<unknown>"),
                                  severity,
                                  str(vuln.get("id") or "<unknown>"),
                              )
                          )

          pnpm_audit = _load_json("pnpm-audit-report.json")
          if not isinstance(pnpm_audit, dict) or not isinstance(pnpm_audit.get("vulnerabilities"), dict):
              raise SystemExit("pnpm audit report has an unexpected schema")
          if isinstance(pnpm_audit, dict):
              vulnerabilities = pnpm_audit.get("vulnerabilities")
              if isinstance(vulnerabilities, dict):
                  for package, data in vulnerabilities.items():
                      if not isinstance(data, dict):
                          continue
                      severity = str(data.get("severity") or "").lower()
                      if severity in SEVERITIES:
                          findings.append(
                              ("pnpm", str(package), severity, str(data.get("id") or "<unknown>"))
                          )

          print(f"HIGH/CRITICAL findings: {len(findings)}")
          for source, package, severity, advisory in findings:
              print(f"- {source}: {package} [{severity}] ({advisory})")

          raise SystemExit(1 if findings else 0)
          PY

  ci-observability:
    name: CI Observability Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - pip-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Write observability summary artifacts
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          PIP_AUDIT_RESULT: ${{ needs.pip-audit.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def classify_from_result(result: str) -> str:
              if result == "success":
                  return "present"
              if result in {"failure", "cancelled", "skipped"}:
                  return "skipped_due_upstream_failure"
              return "missing_expected"

          def entry(group: str, name: str, producer_job: str, producer_result: str) -> dict[str, str]:
              return {
                  "group": group,
                  "name": name,
                  "classification": classify_from_result(producer_result),
                  "producer_job": producer_job,
                  "notes": f"inferred_from_result:{producer_result or 'unknown'}",
              }

          actual_sha = (
              subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          )
          github_sha = os.environ.get("GITHUB_SHA", "")
          pip_audit_result = os.environ.get("PIP_AUDIT_RESULT", "")
          hygiene_result = os.environ.get("HYGIENE_RESULT", "")
          summary = {
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "actor": os.environ.get("GITHUB_ACTOR", ""),
              "job_status": os.environ.get("JOB_STATUS", ""),
              "actual_sha": actual_sha,
          }
          sha_consistency = {
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "job_status": os.environ.get("JOB_STATUS", ""),
              "github_sha": github_sha,
              "actual_sha": actual_sha,
              "sha_match": actual_sha == github_sha,
          }

          artifacts = [
              entry("load_ledger", "load-ledger-ubuntu-latest", "pip-audit", pip_audit_result),
              entry("load_ledger", "load-ledger-macos-latest", "pip-audit", pip_audit_result),
              entry("dependency_security_reports", "dependency-report-ubuntu-latest", "pip-audit", pip_audit_result),
              entry("dependency_security_reports", "dependency-report-macos-latest", "pip-audit", pip_audit_result),
              entry("dependency_security_reports", "pip-audit-report-ubuntu-latest", "pip-audit", pip_audit_result),
              entry("dependency_security_reports", "pip-audit-report-macos-latest", "pip-audit", pip_audit_result),
              entry("dependency_security_reports", "safety-report-ubuntu-latest", "pip-audit", pip_audit_result),
              entry("dependency_security_reports", "safety-report-macos-latest", "pip-audit", pip_audit_result),
              entry("dependency_security_reports", "pnpm-audit-report-ubuntu-latest", "pip-audit", pip_audit_result),
              entry("dependency_security_reports", "pnpm-audit-report-macos-latest", "pip-audit", pip_audit_result),
          ]

          counts = {
              "present": 0,
              "missing_expected": 0,
              "ignored_no_files": 0,
              "skipped_due_upstream_failure": 0,
          }
          for artifact in artifacts:
              classification = artifact["classification"]
              if classification in counts:
                  counts[classification] += 1

          completeness = {
              "schema_version": 1,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "job_status": os.environ.get("JOB_STATUS", ""),
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "artifacts": artifacts,
              "counts": counts,
          }

          upstream_results = {
              "hygiene": hygiene_result,
              "pip-audit": pip_audit_result,
          }

          source_signals: list[str] = []
          secondary_classes: list[str] = []
          job_status = os.environ.get("JOB_STATUS", "")

          missing_with_success_producer = [
              a
              for a in artifacts
              if a["classification"] == "missing_expected"
              and upstream_results.get(a["producer_job"], "") == "success"
          ]
          if missing_with_success_producer:
              source_signals.append("missing_expected_with_success_producer")

          if upstream_results.get("pip-audit") in {"failure", "cancelled", "skipped"}:
              source_signals.append("pip-audit_failed")
          if upstream_results.get("hygiene") in {"failure", "cancelled", "skipped"}:
              source_signals.append("hygiene_failed")

          def add_secondary(value: str) -> None:
              if value not in secondary_classes:
                  secondary_classes.append(value)

          if job_status == "success":
              primary_class = "no_failure"
              confidence = "high"
              notes = "All required upstream jobs succeeded for this run."
              if missing_with_success_producer:
                  add_secondary("artifact_missing")
                  confidence = "low"
                  notes = "Run succeeded but completeness suggests missing expected artifacts."
          else:
              if missing_with_success_producer:
                  primary_class = "artifact_missing"
                  confidence = "medium"
                  notes = "Expected artifact missing while producer job reported success."
              elif upstream_results.get("pip-audit") in {"failure", "cancelled", "skipped"}:
                  primary_class = "dependency_audit"
                  confidence = "high"
                  notes = "Security audit producer job failed."
              elif upstream_results.get("hygiene") in {"failure", "cancelled", "skipped"}:
                  primary_class = "setup_tooling"
                  confidence = "high"
                  notes = "Repository/setup hygiene producer job failed."
              else:
                  primary_class = "unknown_success"
                  confidence = "low"
                  notes = "Non-success run without deterministic class mapping."

          if missing_with_success_producer and primary_class != "artifact_missing":
              add_secondary("artifact_missing")
          if upstream_results.get("pip-audit") in {"failure", "cancelled", "skipped"} and primary_class != "dependency_audit":
              add_secondary("dependency_audit")
          if upstream_results.get("hygiene") in {"failure", "cancelled", "skipped"} and primary_class != "setup_tooling":
              add_secondary("setup_tooling")

          failure_classification = {
              "schema_version": 1,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "job_status": job_status,
              "primary_class": primary_class,
              "secondary_classes": secondary_classes,
              "source_signals": source_signals if source_signals else ["no_failure_signals"],
              "upstream_results": upstream_results,
              "confidence": confidence,
              "notes": notes,
          }

          warning_families = [
              {
                  "family": "NO_COLOR_FORCE_COLOR",
                  "status": "deferred",
                  "source": "deferred_risk_register",
                  "confidence": "medium",
                  "notes": "Known deferred warning family; direct run observation is not asserted in Batch 4A.",
              },
              {
                  "family": "DOCK_LAYOUT_FALLBACK",
                  "status": "deferred",
                  "source": "deferred_risk_register",
                  "confidence": "medium",
                  "notes": "Known deferred compatibility warning; no full-log parsing in this batch.",
              },
              {
                  "family": "ESLINTRC_DEPRECATION",
                  "status": "deferred",
                  "source": "deferred_risk_register",
                  "confidence": "medium",
                  "notes": "Known deferred config migration warning family.",
              },
              {
                  "family": "NODE_ACTION_RUNTIME_WARNING",
                  "status": "unknown",
                  "source": "workflow_metadata_only",
                  "confidence": "low",
                  "notes": "No log parsing in Batch 4A; status intentionally conservative.",
              },
              {
                  "family": "NODE_PUNYCODE_URL_PARSE_TRANSITIVE",
                  "status": "unknown",
                  "source": "workflow_metadata_only",
                  "confidence": "low",
                  "notes": "No deterministic signal source without log parsing.",
              },
              {
                  "family": "RENDERER_TYPEERROR_NOISE",
                  "status": "deferred",
                  "source": "deferred_risk_register",
                  "confidence": "low",
                  "notes": "Deferred warning noise family; reproducibility remains conditional.",
              },
          ]

          warning_counts = {
              "observed": 0,
              "not_observed": 0,
              "deferred": 0,
              "unknown": 0,
          }
          for item in warning_families:
              status = item["status"]
              if status in warning_counts:
                  warning_counts[status] += 1

          warning_summary = {
              "schema_version": 1,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "github_sha": github_sha,
              "job_status": job_status,
              "warning_families": warning_families,
              "summary": warning_counts,
              "non_blocking": True,
          }

          Path("ci-run-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-sha-consistency.json").write_text(
              json.dumps(sha_consistency, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-artifact-completeness.json").write_text(
              json.dumps(completeness, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-failure-classification.json").write_text(
              json.dumps(failure_classification, indent=2) + "\n", encoding="utf-8"
          )
          Path("ci-warning-summary.json").write_text(
              json.dumps(warning_summary, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload observability summary artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-observability-${{ github.job }}
          if-no-files-found: ignore
          path: |
            ci-run-summary.json
            ci-sha-consistency.json
            ci-artifact-completeness.json
            ci-failure-classification.json
            ci-warning-summary.json
